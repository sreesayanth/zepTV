name: Feature request
description: Suggest an idea for ZapTV
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe what you're trying to do and what gets in the way.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: What would you like to happen?
      description: How would it work with a TV remote?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you've considered
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: This doesn't slow down opening the app or changing channels.
        - label: This doesn't need links to pay-TV or pirated content.
