name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # Installs the SDK and accepts its licences; the Android Gradle plugin
      # then downloads platform 37 and build-tools on first use.
      - uses: android-actions/setup-android@v3
        with:
          # The default also asks for the retired "tools" package, which the
          # runner's current SDK command-line tools no longer have.
          packages: platform-tools

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew test --stacktrace

      - name: Assemble debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: "**/build/reports/tests/"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: zaptv-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
