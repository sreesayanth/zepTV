name: Release

# Push a tag like v1.0.0 to build a release APK and attach it to a GitHub Release.
#
# For a properly signed APK, add these repository secrets
# (Settings → Secrets and variables → Actions):
#   ZAPTV_KEYSTORE_BASE64   the release keystore, base64-encoded (base64 -w0 release.jks)
#   ZAPTV_KEYSTORE_PASSWORD
#   ZAPTV_KEY_ALIAS
#   ZAPTV_KEY_PASSWORD
# Without them the APK is signed with a throwaway debug key and the release is
# marked as a pre-release.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3
        with:
          # The default also asks for the retired "tools" package, which the
          # runner's current SDK command-line tools no longer have.
          packages: platform-tools

      - uses: gradle/actions/setup-gradle@v4

      - name: Restore release keystore
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ZAPTV_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "file=$RUNNER_TEMP/release.jks" >> "$GITHUB_OUTPUT"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "No release keystore secret; using the debug key."
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Test and build release APK
        env:
          ZAPTV_KEYSTORE_FILE: ${{ steps.keystore.outputs.file }}
          ZAPTV_KEYSTORE_PASSWORD: ${{ secrets.ZAPTV_KEYSTORE_PASSWORD }}
          ZAPTV_KEY_ALIAS: ${{ secrets.ZAPTV_KEY_ALIAS }}
          ZAPTV_KEY_PASSWORD: ${{ secrets.ZAPTV_KEY_PASSWORD }}
        run: ./gradlew test assembleRelease --stacktrace

      - name: Rename APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/*.apk "dist/ZapTV-${GITHUB_REF_NAME}.apk"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          SIGNED: ${{ steps.keystore.outputs.signed }}
        run: |
          flags="--generate-notes"
          if [ "$SIGNED" != "true" ]; then flags="$flags --prerelease"; fi
          gh release create "$GITHUB_REF_NAME" dist/*.apk --title "ZapTV $GITHUB_REF_NAME" $flags
